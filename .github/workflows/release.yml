name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./travery_frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          BASE_URL=${{ secrets.BASE_URL }}
          COMETCHAT_AUTH_KEY=${{ secrets.COMETCHAT_AUTH_KEY }}
          COMETCHAT_APP_ID=${{ secrets.COMETCHAT_APP_ID }}
          COMETCHAT_REGION=${{ secrets.COMETCHAT_REGION }}
          EOF
        shell: bash

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Get version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            travery_frontend/build/app/outputs/flutter-apk/app-release.apk
            travery_frontend/build/app/outputs/bundle/release/app-release.aab
          body: |
            ## Release ${{ steps.tag.outputs.VERSION }}
            
            📱 Android APK: `app-release.apk`
            📦 App Bundle: `app-release.aab`
            
            ### Changes
            - See commit history for details
            
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
